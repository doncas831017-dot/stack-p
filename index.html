<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>스택챈 폰</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#ddd;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
  #face{position:fixed;inset:0;width:100%;height:100%;display:block}
  #sub{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));text-align:center;font-size:18px;line-height:1.4;min-height:56px;color:#cfd8dc;pointer-events:none}
  #sub.me{color:#7fb8ff}
  #hint{position:fixed;left:0;right:0;top:16px;text-align:center;font-size:13px;color:#666;pointer-events:none}
  #gear{position:fixed;top:10px;right:10px;width:44px;height:44px;border:0;border-radius:22px;background:#111;color:#888;font-size:22px}
  #panel{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;overflow:auto;padding:20px;box-sizing:border-box}
  #panel.on{display:block}
  #panel label{display:block;margin:14px 0 4px;font-size:14px;color:#9aa}
  #panel input,#panel textarea{width:100%;box-sizing:border-box;background:#161616;color:#eee;border:1px solid #333;border-radius:8px;padding:10px;font-size:16px;font-family:inherit}
  #panel textarea{height:120px}
  #panel .row{display:flex;gap:10px;margin-top:20px}
  #panel button{flex:1;padding:12px;border:0;border-radius:8px;font-size:16px;background:#2a3a4a;color:#fff}
  #panel button.main{background:#2f6fed}
  #panel small{display:block;margin-top:6px;color:#777;font-size:12px;line-height:1.4}
</style>
</head>
<body>
<canvas id="face"></canvas>
<div id="hint">화면을 터치하면 대화를 시작해요</div>
<div id="sub"></div>
<button id="gear" aria-label="설정">⚙</button>

<div id="panel">
  <h2 style="margin:0 0 4px">설정</h2>
  <label>Gemini API 키</label>
  <input id="key" type="password" autocomplete="off" placeholder="AIza...">
  <small>이 폰의 브라우저에만 저장되고, 구글 서버로 요청을 보낼 때만 사용돼요.</small>
  <label>모델</label>
  <input id="model" placeholder="gemini-flash-latest">
  <small>모델 이름이 바뀌어 오류가 나면 여기만 고치면 돼요. 예: gemini-2.5-flash</small>
  <label>성격 / 지시문</label>
  <textarea id="persona"></textarea>
  <label>말하기 속도 <span id="rv"></span></label>
  <input id="rate" type="range" min="0.7" max="1.5" step="0.05">
  <div class="row">
    <button id="reset">기본값</button>
    <button id="save" class="main">저장</button>
  </div>
</div>

<script>
(function(){
'use strict';
const DEFAULT_PERSONA = '너는 책상 위에 사는 작은 로봇 친구 "스택챈"이야. 친근한 존댓말로 한두 문장만 짧게 대답해. 이모지, 마크다운, 목록은 쓰지 마. 답변 맨 앞에 지금 감정을 [neutral] [happy] [sad] [surprised] [angry] 중 하나로 붙여.';
const DEFAULTS = {key:'', model:'gemini-flash-latest', persona:DEFAULT_PERSONA, rate:1.05};
const $ = s => document.querySelector(s);

// ---------- 설정 ----------
let cfg = Object.assign({}, DEFAULTS);
try { const s = JSON.parse(localStorage.getItem('scp_cfg')||'null'); if (s) cfg = Object.assign(cfg, s); } catch(e){}
function saveCfg(){ try { localStorage.setItem('scp_cfg', JSON.stringify(cfg)); } catch(e){} }
function fillPanel(){ $('#key').value=cfg.key; $('#model').value=cfg.model; $('#persona').value=cfg.persona; $('#rate').value=cfg.rate; $('#rv').textContent=cfg.rate; }
$('#rate').oninput = e => $('#rv').textContent = e.target.value;
$('#gear').onclick = e => { e.stopPropagation(); stopAll(); fillPanel(); $('#panel').classList.add('on'); };
$('#save').onclick = () => {
  cfg.key = $('#key').value.trim();
  cfg.model = $('#model').value.trim() || DEFAULTS.model;
  cfg.persona = $('#persona').value.trim() || DEFAULT_PERSONA;
  cfg.rate = parseFloat($('#rate').value) || 1;
  saveCfg(); $('#panel').classList.remove('on');
};
$('#reset').onclick = () => { const k = $('#key').value; cfg = Object.assign({}, DEFAULTS, {key:k.trim()}); fillPanel(); };
if (!cfg.key) { fillPanel(); $('#panel').classList.add('on'); }

// ---------- 상태 ----------
let mode = 'idle';          // idle | listening | thinking | speaking
let emotion = 'neutral';    // neutral | happy | sad | surprised | angry
let active = false;         // 대화 루프 켜짐 여부
let history = [];
let rec = null, wakeLock = null, gen = 0, emptyCount = 0;

function setSub(text, me){ const el=$('#sub'); el.textContent=text||''; el.className = me ? 'me' : ''; }
function setMode(m){ mode = m; $('#hint').style.display = active ? 'none' : 'block'; }

// ---------- 얼굴 ----------
const cv = $('#face'), ctx = cv.getContext('2d');
let W=0, H=0;
function resize(){
  const d = window.devicePixelRatio||1; W = innerWidth; H = innerHeight;
  cv.width = W*d; cv.height = H*d; ctx.setTransform(d,0,0,d,0,0);
}
addEventListener('resize', resize); resize();

const f = {open:1, mouth:0.05, lx:0, ly:0, smile:0, brow:0, size:1};
let nextBlink = 1500, blinkStart = -1000, nextLook = 0, lookTX = 0, lookTY = 0;
const lerp = (a,b,k) => a + (b-a)*k;

function frame(t){
  // 깜빡임
  if (t > nextBlink) { blinkStart = t; nextBlink = t + 2200 + Math.random()*3800; }
  const bp = (t - blinkStart) / 170;
  const blink = (bp>=0 && bp<=1) ? Math.sin(bp*Math.PI) : 0;

  // 시선
  if (t > nextLook) { lookTX = (Math.random()-.5)*0.8; lookTY = (Math.random()-.5)*0.4; nextLook = t + 900 + Math.random()*2200; }
  let tx = lookTX, ty = lookTY;
  if (mode==='thinking') { tx = 0.5; ty = -0.7; }
  if (mode==='listening') { tx = lookTX*0.3; ty = 0; }

  // 표정 목표값
  let open = 1, smile = 0, brow = 0, size = 1, mouthT = 0.05;
  if (mode==='listening') { size = 1.08; }
  if (emotion==='happy') { smile = 1; }
  if (emotion==='sad') { brow = -1; open = 0.8; }
  if (emotion==='angry') { brow = 1; open = 0.8; }
  if (emotion==='surprised') { size = 1.25; mouthT = 0.45; }
  if (mode==='speaking') { mouthT = 0.12 + 0.55*Math.abs(Math.sin(t/105 + Math.sin(t/330)*2)); }
  if (mode==='thinking') { mouthT = 0.02; }

  f.open = lerp(f.open, open, .2);
  f.mouth = lerp(f.mouth, mouthT, .35);
  f.lx = lerp(f.lx, tx, .12); f.ly = lerp(f.ly, ty, .12);
  f.smile = lerp(f.smile, smile, .15);
  f.brow = lerp(f.brow, brow, .15);
  f.size = lerp(f.size, size, .15);

  draw(blink);
  requestAnimationFrame(frame);
}

function draw(blink){
  ctx.clearRect(0,0,W,H);
  const base = Math.min(W, H*0.9);
  const portrait = H > W;
  const cy = H * (portrait ? 0.40 : 0.42);
  const gap = W * (portrait ? 0.26 : 0.2);
  const r = base * 0.085 * f.size;
  const eyeOpen = Math.max(0.04, f.open * (1 - blink));
  ctx.fillStyle = '#f2f2f2'; ctx.strokeStyle = '#f2f2f2';
  ctx.lineCap = 'round';

  for (const side of [-1, 1]) {
    const cx = W/2 + side*gap + f.lx*r*0.6;
    const cyy = cy + f.ly*r*0.6;
    if (f.smile > 0.5 && blink < 0.5) {
      // 웃는 눈 ^ ^
      ctx.lineWidth = r*0.28;
      ctx.beginPath(); ctx.arc(cx, cyy + r*0.35, r*0.8, Math.PI*1.12, Math.PI*1.88); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.ellipse(cx, cyy, r, r*eyeOpen, 0, 0, Math.PI*2); ctx.fill();
      // 눈썹/눈꺼풀 (화남·슬픔)
      if (Math.abs(f.brow) > 0.05) {
        ctx.save(); ctx.fillStyle = '#000';
        ctx.translate(cx, cyy); ctx.rotate(f.brow * side * 0.45 * -1);
        ctx.fillRect(-r*1.3, -r*1.6, r*2.6, r*(1.15 - (f.brow<0 ? 0.0 : 0.0)));
        ctx.restore();
      }
    }
  }

  // 입
  const my = cy + base * (portrait ? 0.2 : 0.17);
  const mw = base * 0.12 * (1 + f.smile*0.4);
  const mh = base * 0.14 * f.mouth;
  ctx.lineWidth = base * 0.012;
  if (f.mouth > 0.14) {
    ctx.beginPath(); ctx.ellipse(W/2, my, mw*0.55, Math.max(2, mh*0.5), 0, 0, Math.PI*2); ctx.fill();
  } else if (f.smile > 0.5) {
    ctx.beginPath(); ctx.arc(W/2, my - mw*0.35, mw*0.7, Math.PI*0.15, Math.PI*0.85); ctx.stroke();
  } else if (emotion==='sad') {
    ctx.beginPath(); ctx.arc(W/2, my + mw*0.5, mw*0.6, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(W/2 - mw*0.5, my); ctx.lineTo(W/2 + mw*0.5, my); ctx.stroke();
  }

  // 생각 중 점 3개
  if (mode==='thinking') {
    const t = performance.now()/350;
    for (let i=0;i<3;i++){
      ctx.globalAlpha = 0.3 + 0.7*Math.max(0, Math.sin(t - i*0.9));
      ctx.beginPath(); ctx.arc(W/2 + (i-1)*base*0.05, cy - base*0.19, base*0.011, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}
requestAnimationFrame(frame);

// ---------- 화면 꺼짐 방지 ----------
async function keepAwake(){ try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible' && active) keepAwake(); });

// ---------- 음성 합성 ----------
let voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices(); }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function koVoice(){ return voices.find(v => /^ko/i.test(v.lang)) || null; }

function speak(text, done){
  if (!('speechSynthesis' in window)) { done && done(); return; }
  speechSynthesis.cancel();
  const parts = text.split(/(?<=[.!?。！？\n])\s*/).map(s=>s.trim()).filter(Boolean);
  if (!parts.length) { done && done(); return; }
  const myGen = gen;
  setMode('speaking');
  parts.forEach((p, i) => {
    const u = new SpeechSynthesisUtterance(p);
    u.lang = 'ko-KR'; u.rate = cfg.rate; u.pitch = 1.1;
    const v = koVoice(); if (v) u.voice = v;
    if (i === parts.length-1) {
      u.onend = u.onerror = () => { if (myGen===gen) done && done(); };
    }
    speechSynthesis.speak(u);
  });
}

// ---------- 음성 인식 ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listen(){
  if (!active) return;
  if (!SR) { fail('이 브라우저는 음성 인식을 지원하지 않아요. 크롬으로 열어 주세요.'); return; }
  const myGen = gen;
  let finalText = '', lastErr = '';
  rec = new SR();
  rec.lang = 'ko-KR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  rec.onresult = e => {
    let interim = '';
    for (let i=e.resultIndex; i<e.results.length; i++){
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    setSub(finalText + interim, true);
  };
  rec.onstart = () => { if (myGen === gen) setSub('듣는 중… 말씀해 보세요'); };
  rec.onspeechstart = () => { if (myGen === gen) setSub('…'); };
  rec.onerror = e => { lastErr = e.error || ''; };
  rec.onend = () => {
    if (myGen !== gen || !active) return;
    if (/not-allowed|service-not-allowed/.test(lastErr)) { fail('마이크 권한 또는 음성 인식 서비스가 막혀 있어요. (오류: ' + lastErr + ')'); return; }
    if (/network|audio-capture|language-not-supported/.test(lastErr)) { fail('음성 인식 오류: ' + lastErr); return; }
    if (finalText.trim()) { emptyCount = 0; ask(finalText.trim()); }
    else if (++emptyCount >= 4) { fail('목소리가 안 들려요 (' + (lastErr || '결과 없음') + '). 화면을 터치해서 다시 시작해 주세요.'); }
    else setTimeout(listen, 250);
  };
  try { setMode('listening'); rec.start(); } catch(e){ setTimeout(listen, 500); }
}

// ---------- Gemini ----------
async function ask(text){
  const myGen = gen;
  setMode('thinking'); emotion = 'neutral';
  history.push({role:'user', parts:[{text}]});
  if (history.length > 16) history = history.slice(-16);
  try {
    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(cfg.model) + ':generateContent', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':cfg.key},
      body: JSON.stringify({
        systemInstruction:{parts:[{text:cfg.persona}]},
        contents: history
      })
    });
    const data = await res.json();
    if (myGen !== gen) return;
    if (!res.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + res.status));
    let reply = (((data.candidates||[])[0]||{}).content||{}).parts;
    reply = (reply||[]).map(p=>p.text||'').join('').trim();
    if (!reply) throw new Error('빈 응답이 왔어요');
    const m = reply.match(/^\s*\[(neutral|happy|sad|surprised|angry)\]\s*/i);
    if (m) { emotion = m[1].toLowerCase(); reply = reply.slice(m[0].length); }
    reply = reply.replace(/[*_`#>]/g, '').trim();
    history.push({role:'model', parts:[{text:reply}]});
    setSub(reply, false);
    speak(reply, () => { emotion = 'neutral'; if (active) setTimeout(listen, 200); else setMode('idle'); });
  } catch(err){
    if (myGen !== gen) return;
    history.pop();
    fail('오류: ' + (err.message || err));
  }
}

function fail(msg){
  active = false; gen++;
  try { rec && rec.abort(); } catch(e){}
  try { speechSynthesis.cancel(); } catch(e){}
  emotion = 'sad'; setMode('idle'); setSub(msg, false);
  setTimeout(() => { if (mode==='idle') emotion = 'neutral'; }, 4000);
}

function stopAll(){
  active = false; gen++;
  try { rec && rec.abort(); } catch(e){}
  try { speechSynthesis.cancel(); } catch(e){}
  emotion = 'neutral'; setMode('idle'); setSub('');
  try { wakeLock && wakeLock.release(); } catch(e){}
}

// ---------- 터치로 시작/중지 ----------
document.addEventListener('click', e => {
  if (e.target.closest('#panel') || e.target.closest('#gear')) return;
  if (!cfg.key) { fillPanel(); $('#panel').classList.add('on'); return; }
  if (active) { stopAll(); return; }
  active = true; gen++; emptyCount = 0; setSub('');
  keepAwake();
  // 사용자 터치 안에서 음성 합성 잠금 해제
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch(err){}
  listen();
});
setMode('idle');
})();
</script>
</body>
</html>
